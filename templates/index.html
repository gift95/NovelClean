<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说 TXT 校准净化</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e2e5ea; --ink:#1f2430; --muted:#6b7280;
  --accent:#0f766e; --accent-soft:#e6f4f1; --warn:#b45309; --warn-soft:#fef4e6;
  --bad:#b42318; --bad-soft:#fdeceb; --ok:#166534; --ok-soft:#e8f5ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:22px;margin:0 0 6px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
#drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;
  transition:.18s;cursor:pointer;background:#fbfcfd}
#drop.hot{border-color:var(--accent);background:var(--accent-soft)}
#drop b{font-size:16px;display:block;margin-bottom:6px}
#drop span{color:var(--muted);font-size:13px}
input[type=file]{display:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:9px 16px;border-radius:9px;font-size:14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.files{margin-top:14px;font-size:13px;color:var(--muted)}
.files div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;margin-right:4px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px}
.stat{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
.a{color:var(--accent);text-decoration:none;font-weight:600}
.a:hover{text-decoration:underline}
#log{margin-top:14px;font-size:13px;color:var(--muted)}
.bar{height:3px;background:var(--accent);width:0;transition:width .2s;border-radius:2px}
footer{margin-top:28px;color:var(--muted);font-size:12px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px}
pre{background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:10px;
  overflow:auto;font-size:12.5px;max-height:320px}
</style>
</head>
<body>
<div class="wrap">
  <h1>小说 TXT 校准净化</h1>
  <div class="sub">上传正版备份或自用文本，自动清掉源站推广、页面水印、碎片广告，并修复章节编号。
    单文件上限 {{ max_file_mb }} MB，一次最多 {{ max_files }} 本。</div>

  <div class="panel">
    <div id="drop">
      <b>把 .txt 拖到这里，或点击选择</b>
      <span>支持多本一起处理</span>
    </div>
    <input type="file" id="file" accept=".txt,text/plain" multiple>
    <div class="files" id="list"></div>
    <div class="row">
      <button class="primary" id="go" disabled>开始净化</button>
      <button id="clear" disabled>清空</button>
      <span class="a" id="zip" style="display:none"></span>
    </div>
    <div class="bar" id="bar"></div>
    <div id="log"></div>
  </div>

  <div id="result"></div>

  <footer>处理在服务端完成，原始文件与成品只保留 2 小时后自动删除。不要上传你无权处理的文本。</footer>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const list = document.getElementById('list');
const go = document.getElementById('go');
const clearBtn = document.getElementById('clear');
const logEl = document.getElementById('log');
const bar = document.getElementById('bar');
const result = document.getElementById('result');
let picked = [];

function fmt(b){ return b > 1048576 ? (b/1048576).toFixed(2)+' MB' : (b/1024).toFixed(0)+' KB'; }

function render(){
  list.innerHTML = picked.map(f =>
    `<div><span>${f.name}</span><span>${fmt(f.size)}</span></div>`).join('');
  go.disabled = picked.length === 0;
  clearBtn.disabled = picked.length === 0;
}

function addFiles(fs){
  for (const f of fs){
    if (!/\.txt$/i.test(f.name) && f.type !== 'text/plain') continue;
    if (picked.some(x => x.name === f.name && x.size === f.size)) continue;
    picked.push(f);
  }
  render();
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.add('hot');
}));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.remove('hot');
}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
clearBtn.addEventListener('click', () => { picked = []; render(); logEl.textContent=''; result.innerHTML=''; document.getElementById('zip').style.display='none'; });

function chip(n, label){
  const cls = n === 0 ? 'ok' : (n > 2 ? 'bad' : 'warn');
  return `<span class="chip ${cls}">${label} ${n}</span>`;
}

go.addEventListener('click', async () => {
  if (!picked.length) return;
  go.disabled = true; clearBtn.disabled = true;
  logEl.textContent = '处理中，大文件需要几秒到几十秒…';
  bar.style.width = '0%';
  let p = 0;
  const timer = setInterval(() => {
    p = Math.min(92, p + Math.max(1, (92 - p) * 0.08));
    bar.style.width = p + '%';
  }, 180);

  const fd = new FormData();
  picked.forEach(f => fd.append('files', f, f.name));

  try {
    const res = await fetch('/api/clean', { method: 'POST', body: fd });
    const data = await res.json();
    clearInterval(timer);
    if (!res.ok){
      bar.style.width = '100%';
      logEl.textContent = data.error || '处理失败';
      go.disabled = false; clearBtn.disabled = false;
      return;
    }
    bar.style.width = '100%';
    const okCount = data.results.filter(r => !r.error).length;
    logEl.textContent = `完成：${okCount} 本成功${data.results.length - okCount ? '，' + (data.results.length - okCount) + ' 本失败' : ''}`;

    const zip = document.getElementById('zip');
    zip.href = data.zip_url; zip.textContent = '下载全部（zip）';
    zip.style.display = 'inline';

    const rows = data.results.map(r => {
      if (r.error) {
        return `<tr><td>${r.name}</td><td colspan="6"><span class="chip bad">${r.error}</span></td></tr>`;
      }
      const s = r.stats;
      return `<tr>
        <td>${r.name}</td>
        <td class="num">${r.chapters}</td>
        <td class="num">${r.first ?? '-'}–${r.last ?? '-'}</td>
        <td>${chip(r.still_junk,'推广')}${chip(r.still_space,'水印')}${chip(r.bad_indent,'缩进')}</td>
        <td class="num">${s.drop_junk + s.strip_prefix + (s.strip_inline || 0)}</td>
        <td class="num">${s.renum}</td>
        <td class="num">${s.drop_chapter || 0}</td>
        <td><a class="a" href="${r.clean_url}">成品</a> · <a class="a" href="${r.audit_url}">审计</a></td>
      </tr>
      <tr><td colspan="8"><div class="stat">
        编码 ${r.encoding} · ${fmt(r.bytes_in)} → ${fmt(r.bytes_out)} ·
        去水印空格 ${s.space} · 重复句号 ${s.dot2} · 收尾引号 ${s.quote_tail} ·
        标题规范化（标记 ${s.head_fix_mark} / 补第 ${s.head_fix_di} / 补空格 ${s.head_fix_space} / 中文数字 ${s.cn2ar} / 补编号 ${s.head_fix_nonum}）·
        缩进归一 ${s.indent_fix} · 审计 ${r.audit_lines} 条
        ${r.dups.length ? '· <span class="chip warn">重号 ' + r.dups.length + '</span>' : ''}
        ${r.gaps.length ? '· <span class="chip warn">缺号 ' + r.gaps.length + '</span>' : ''}
        ${r.unbalanced ? '· 章内引号不闭合 ' + r.unbalanced + ' 章（保留）' : ''}
      </div></td></tr>`;
    }).join('');

    result.innerHTML = `<div class="panel" style="margin-top:18px">
      <div class="row" style="margin-top:0">
        <b>处理结果</b>
        <a class="a" href="${data.report_url}">查看报告</a>
      </div>
      <table><thead><tr>
        <th>文件</th><th>章节</th><th>章号区间</th><th>残留校验</th>
        <th>清理行数</th><th>编号复位</th><th>删伪章节</th><th>下载</th>
      </tr></thead><tbody>${rows}</tbody></table>
      <div class="hint">「残留校验」应全部为 0；出现重号/缺号说明源文件本身有结构缺陷，已在审计文件里逐条记录，未强行改号。「删伪章节」是「正文全是水印广告的假章」被整章删除的数量。</div>
    </div>`;
  } catch (e) {
    clearInterval(timer);
    logEl.textContent = '网络错误：' + e.message;
  }
  go.disabled = false; clearBtn.disabled = false;
});
</script>
</body>
</html>
